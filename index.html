<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語学習アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>英単語クイズ</h1>

  <section id="add-word">
    <h2>単語を追加</h2>
    <input type="text" id="new-word" placeholder="単語">
    <input type="text" id="new-definition" placeholder="定義">
    <button id="add-btn">追加</button>
  </section>

  <section id="quiz">
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="result"></p>
    <button id="next-btn" style="display:none;">次へ</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
